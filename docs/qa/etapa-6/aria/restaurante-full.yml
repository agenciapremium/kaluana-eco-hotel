  - heading "Peixe de Rondônia, feito do jeito daqui." [level=2]
  - paragraph: Tambaqui, pirarucu, tucunaré e matrinxã. Farinha, pirão, vinagrete e o que a estação der. Uma cozinha que conhece o rio de onde o peixe veio.
  - link "Os peixes do Universo":
    - /url: /universo/peixes
  - img "Garfo levantando uma lasca de peixe grelhado, com vapor, sobre prato escuro"
  - img "Três tigelas de barro com farinha, pirão e vinagrete, vistas de cima"
