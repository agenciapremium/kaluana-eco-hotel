  - paragraph: O Kaluanã Eco Hotel é um hotel em construção em Ji-Paraná, Rondônia, com inauguração prevista para dezembro de 2026. Terá restaurante aberto ao público, espaços para eventos e quartos nomeados com rios, peixes, árvores e aves da Amazônia.
  - paragraph: O Kaluanã é um eco hotel para quem chega cansado, precisa produzir ou precisa parar. Está sendo construído à vista de todo mundo.
