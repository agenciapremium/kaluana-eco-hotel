  - text: Equipe
  - heading "Gente de Ji-Paraná." [level=2]
  - paragraph: O Kaluanã é conduzido por uma equipe local, com gestão geral de Adriano Siqueira. Quem recebe você conhece a cidade e sabe indicar caminho, restaurante e horário.
  - img "Prumo pendurado num fio contra o céu claro"
  - heading "Venha ver de perto." [level=2]
  - paragraph: Reservas abertas para dezembro de 2026. Para eventos e hospedagem corporativa, fale com a equipe.
