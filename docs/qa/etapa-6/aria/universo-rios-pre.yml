  - heading "Andar dos Rios" [level=1]
  - paragraph: Rios da Amazônia. Uma bacia.
  - paragraph: "Alguns você conhece de nome, como o Amazonas e o Negro. Outros nascem e terminam aqui perto, como o Machado, que corta Ji-Paraná, e o Jamari. Todos contam a mesma história por caminhos diferentes: a água que passa por Rondônia é a água que forma a Amazônia."
