        - listitem: Rio Machado
    - paragraph: Este é o rio que corta a cidade onde você está. Ji-Paraná, em tupi, quer dizer rio do machado. O Machado divide a cidade em duas e segue para o norte até o Madeira.
    - heading "Por que está no Kaluanã" [level=2]
    - paragraph: Se fosse para escolher um único quarto para explicar o Kaluanã, seria este. O hotel fala de Ji-Paraná, e Ji-Paraná é o rio. Ele é o único rio deste andar que você pode ver a poucos minutos daqui.
    - img "Rio Machado, margem com morros"
    - heading "História" [level=2]
    - paragraph: "O Machado nasce do encontro de dois rios que descem da Chapada dos Parecis, na região de Vilhena: o Pimenta Bueno, também chamado Apidiá, e o Comemoração, também chamado Barão de Melgaço. Os dois se juntam em Pimenta Bueno."
    - paragraph: Dali o rio corre para o norte, passa por Cacoal e chega a Ji-Paraná, onde separa o primeiro e o segundo distrito da cidade. Segue por Tabajara e deságua no Madeira em Calama, distrito de Porto Velho, em um trecho navegável.
    - paragraph: O nome indígena, Ji-Paraná, batizou a cidade. Ji é machado e paraná é rio. O povoado nasceu de uma estação telegráfica da Comissão Rondon, no ponto em que o rio Urupá encontra o Machado. A vila cresceu, chamou-se Vila de Rondônia e virou município com o nome do rio em 1977.
    - heading "Curiosidades" [level=2]
    - list:
      - listitem: A ponte sobre o Machado é a costura de Ji-Paraná. É por ela que a cidade atravessa de um distrito para o outro todos os dias.
      - listitem: O Machado é o maior rio que nasce e termina dentro de Rondônia.
      - listitem: Na seca, o rio expõe praias de areia em Ji-Paraná e Cacoal. Elas fazem parte do calendário de lazer das duas cidades.
      - listitem: Tambaqui, pintado, tucunaré e piau vivem no rio. Os pescadores da região conhecem os poços pelo nome.
