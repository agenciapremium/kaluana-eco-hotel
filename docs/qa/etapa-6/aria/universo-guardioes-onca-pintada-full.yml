        - listitem: Onça-pintada
    - paragraph: A onça-pintada é o maior felino das Américas e o terceiro do mundo. Tem a mordida mais forte entre os grandes felinos em relação ao tamanho, capaz de atravessar o casco de uma tartaruga. Nada, escala, caça jacaré. Para os povos da Amazônia, é o guerreiro da floresta.
    - heading "Por que está no Kaluanã" [level=2]
    - paragraph: Kaluanã significa grande guerreiro. A suíte principal do hotel só podia ter um nome. A onça-pintada é a força que não precisa se exibir. Quem se hospeda aqui dorme no quarto mais alto e mais silencioso da casa, com o nome do animal que manda na floresta.
    - img "Onça-pintada, onça sentada na mata"
    - heading "História" [level=2]
    - paragraph: A onça-pintada vive do México à Argentina, e a Amazônia é sua maior área contínua. Os machos chegam a 130 quilos no Pantanal e são um pouco menores na floresta. A pelagem amarela tem rosetas pretas com pontos no centro, o que a distingue do leopardo. A onça-preta é o mesmo animal, com excesso de pigmento.
    - paragraph: Caça sozinha, de emboscada, e mata com uma mordida no crânio, ao contrário dos outros grandes felinos, que atacam o pescoço. Come capivaras, jacarés, veados, tatus, peixes e o que mais encontrar. Nada com facilidade e cruza rios largos.
    - paragraph: Cada onça ocupa um território de dezenas de quilômetros quadrados e precisa de floresta contínua. Em Rondônia, vive nas áreas protegidas do Guaporé, dos Pacaás Novos e do vale do Madeira. O nome jaguar vem do tupi e é usado em todo o mundo.
    - heading "Curiosidades" [level=2]
    - list:
      - listitem: A onça-pintada é o único grande felino das Américas que ruge. O som é um ronco grave chamado de esturro.
      - listitem: Ela caça jacarés na água e os arrasta para a margem.
      - listitem: Em cerâmicas, máscaras e mitos de dezenas de povos indígenas, a onça é o símbolo de poder e transformação.
      - listitem: A rosetas de cada onça são únicas, como impressões digitais, e permitem identificar indivíduos em fotos de armadilhas fotográficas.
