- main:
  - text: Ji-Paraná, Rondônia
  - heading "Hotel em Ji-Paraná para quem chega cansado, precisa produzir ou precisa parar." [level=1]
  - paragraph: O Kaluanã Eco Hotel é um hotel em Ji-Paraná, Rondônia, na Rodovia Pastor Severo Antonio de Araujo, 2015. Tem restaurante aberto ao público e quartos nomeados com rios, peixes, árvores e aves da Amazônia. Inauguração prevista para dezembro de 2026.
  - paragraph: O Kaluanã é um eco hotel novo em Ji-Paraná, com restaurante aberto ao público e espaços para eventos. Quartos com nome de rio, de peixe, de árvore e de ave. Abre em dezembro de 2026.
  - link "Reservar":
    - /url: /reservas
  - link "Conhecer o hotel":
    - /url: /o-kaluana
  - link "Rolar para o conteúdo":
    - /url: "#conteudo-principal"
    - text: Rolar
  - text: Para quem é
  - heading "Três jeitos de chegar no Kaluanã." [level=2]
  - paragraph: Cada hóspede chega de um jeito. O hotel foi pensado para três deles.
  - img "Mãos sobre um balcão de madeira, uma delas com uma chave"
  - heading "Chegou cansado." [level=3]
  - paragraph: Veio de estrada, chegou tarde, precisa de cama, chuveiro e silêncio. Check-in rápido, café cedo e a certeza de acordar apresentável.
  - img "Mesa de madeira com notebook fechado, caneca de café e bloco de notas"
  - heading "Precisa produzir." [level=3]
  - paragraph: Tem reunião amanhã, relatório hoje e uma ligação daqui a pouco. Mesa de trabalho, internet que funciona, café à mão e um lugar para receber gente.
  - img "Cadeira de madeira com almofada de linho, folhagem ao fundo"
  - heading "Precisa parar." [level=3]
  - paragraph: Não tem hora para nada. Restaurante sem pressa, varanda, uma tarde sem agenda e um quarto com nome de rio para saber onde está.
  - link "Ver acomodações":
    - /url: /acomodacoes
  - img "Símbolo do Kaluanã"
  - text: Kaluanã
  - heading "Grande guerreiro." [level=2]
  - paragraph: "Kaluanã é um nome de origem indígena. Quer dizer grande guerreiro. Foi a primeira decisão do hotel e é a que explica todas as outras: um lugar que respeita a terra onde está, a cidade que o recebe e a pessoa que entra pela porta."
  - link "A história do Kaluanã":
    - /url: /o-kaluana
  - text: Universo Kaluanã
  - heading "Cada quarto tem um nome. Cada nome tem uma história." [level=2]
  - paragraph: No primeiro andar, os rios. No segundo, os peixes. No terceiro, as árvores. No quarto, as aves. Cada porta leva o nome de um elemento da Amazônia e cada quarto tem um QR Code que conta a história dele. Você pode dormir no Rio Machado, que corta Ji-Paraná, ou na Samaúma, a árvore mais alta da floresta.
  - region "Andar dos Rios, 1º andar":
