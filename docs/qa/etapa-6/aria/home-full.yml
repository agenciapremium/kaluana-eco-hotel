  - text: Restaurante Kaluanã
  - heading "Aberto para quem está hospedado e para quem não está." [level=2]
  - img "Peixe grelhado em prato de cerâmica com farofa, vinagrete e limão"
  - paragraph: O Restaurante Kaluanã fica no hotel e atende a cidade. Café da manhã, almoço e jantar, com peixe de Rondônia no cardápio e mesa para quem quer sentar sem hora para levantar.
  - link "Conhecer o restaurante":
    - /url: /restaurante
  - text: Onde estamos
  - heading "Ji-Paraná, o coração de Rondônia." [level=2]
  - paragraph: A segunda maior cidade do estado, cortada pelo rio Machado e atravessada pela BR-364. Polo de negócios, de saúde, de ensino e de agro. O Kaluanã fica na Rodovia Pastor Severo Antonio de Araujo, 2015.
  - link "Como chegar":
    - /url: /ji-parana
  - figure "Mapa esquemático, sem escala.":
    - img "Mapa esquemático de Rondônia A BR-364 cruza o estado de Porto Velho a Vilhena. O rio Machado corta Ji-Paraná e segue ao norte até o rio Madeira. O Kaluanã fica em Ji-Paraná, no centro do estado.": Porto Velho Ariquemes Cacoal Vilhena Kaluanã Ji-Paraná rio Madeira rio Machado BR-364
    - text: Mapa esquemático, sem escala.
  - text: Diário do Kaluanã
  - heading "A obra, contada por quem constrói." [level=2]
  - img "Mãos segurando um punhado de terra vermelha, folhas ao fundo"
  - paragraph: Antes de abrir as portas, o Kaluanã está sendo construído à vista de todo mundo. Acompanhe.
  - link "Ler as histórias":
