      - listitem:
        - link "Início":
          - /url: /
      - listitem: Ji-Paraná
  - figure:
    - img "Mapa esquemático de Ji-Paraná O rio Machado corta a cidade de sul a norte e separa os dois distritos. A BR-364 atravessa a cidade. O Kaluanã fica no acesso à cidade e o aeroporto José Coleto a noroeste. Desenho sem escala.": 1º distrito 2º distrito BR-364 rio Machado Kaluanã Aeroporto José Coleto Centro Orla do rio
  - text: Onde estamos
  - heading "O coração de Rondônia." [level=2]
  - paragraph: Ji-Paraná fica no centro do estado, cortada ao meio pelo rio Machado. É a segunda maior cidade de Rondônia e o ponto de encontro de quem faz negócio na região. O Kaluanã fica na Rodovia Pastor Severo Antonio de Araujo, 2015.
  - text: Chegando
  - heading "De avião, de carro ou de ônibus." [level=2]
  - paragraph: "De carro: a BR-364 cruza a cidade; Porto Velho fica a cerca de 370 km, Cacoal a cerca de 95 km, Ariquemes a cerca de 195 km e Vilhena a cerca de 330 km."
  - text: Rio Machado
  - heading "O rio que dá nome à cidade." [level=2]
  - paragraph: Ji-Paraná, em tupi, quer dizer rio do machado. O Machado divide a cidade em dois distritos e é o mesmo rio que dá nome ao quarto 112 do hotel. Na seca, expõe praias. O ano inteiro, é o lugar onde a cidade se encontra.
  - link "A história do rio Machado":
    - /url: /universo/rios/rio-machado
  - img "Rio Machado, proa de barco no rio"
  - text: Na cidade
  - heading "Para quem tem uma tarde livre." [level=2]
  - paragraph: A orla do rio Machado. O comércio do centro. Feira de produtos da região. E, no fim de semana, as praias do rio na seca.
  - text: Para quem vem a trabalho
  - heading "Uma cidade que trabalha." [level=2]
  - paragraph: Agro, comércio, saúde e ensino. Ji-Paraná concentra empresas, hospitais, universidades e distribuidoras que atendem a região central de Rondônia. Quem vem a trabalho encontra o que precisa a poucos minutos do hotel.
  - link "Ver as acomodações":
    - /url: /acomodacoes
  - text: Perguntas frequentes
