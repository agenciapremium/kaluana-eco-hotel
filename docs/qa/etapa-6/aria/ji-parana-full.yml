- main:
  - text: Onde estamos
  - heading "Ji-Paraná" [level=1]
  - paragraph: O coração de Rondônia.
  - paragraph: Ji-Paraná fica no centro do estado, cortada ao meio pelo rio Machado. É a segunda maior cidade de Rondônia e o ponto de encontro de quem faz negócio na região. O Kaluanã fica na Rodovia Pastor Severo Antonio de Araujo, 2015.
  - link "Como chegar ao hotel":
    - /url: /contato
  - link "Rolar para o conteúdo":
    - /url: "#conteudo-principal"
    - text: Rolar
  - navigation "Você está em":
