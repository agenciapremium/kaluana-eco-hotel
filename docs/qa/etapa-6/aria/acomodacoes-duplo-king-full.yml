- main:
  - heading "Duplo King" [level=1]
  - paragraph: Chegou tarde. Amanhã cedo, está pronto.
  - paragraph: Cama king, mesa de trabalho com tomadas à mão, internet que aguenta videochamada e cortina que fecha de verdade. O quarto para quem vem a trabalho e precisa render.
  - link "Reservar esta categoria":
    - /url: /reservas
