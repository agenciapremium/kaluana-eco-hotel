      - listitem: Duplo King
  - 'region "Detalhes: Duplo King"':
    - img "Caderno aberto em branco, lápis e xícara de café vistos de cima sobre uma mesa de madeira"
    - img "Caderno de couro com caneta-tinteiro e uma xícara verde sobre uma mesa de madeira"
    - img "Luminária de latão acesa sobre uma mesa escura ao entardecer, com um notebook fechado ao lado"
  - text: O quarto
  - heading "O que tem no quarto." [level=2]
  - paragraph: O Duplo King é o quarto para duas pessoas do Kaluanã Eco Hotel, em Ji-Paraná, com cama king e mesa de trabalho. É a categoria indicada para viagens de trabalho e para casais.
  - list:
    - listitem: Até 2 pessoas.
    - listitem: Cama king.
    - listitem: Ar-condicionado.
    - listitem: Internet sem fio.
    - listitem: Mesa de trabalho com tomadas e USB.
    - listitem: TV.
    - listitem: Frigobar.
    - listitem: Banheiro privativo.
    - listitem: Café da manhã incluído.
  - text: Para quem
  - heading "Para quem precisa produzir." [level=2]
  - paragraph: Gerente regional, representante, médico de passagem, consultor. Quem chega no fim do dia e sai cedo. O Duplo King foi desenhado para essa rotina.
  - img "Caderno de couro com caneta-tinteiro e uma xícara verde sobre uma mesa de madeira"
  - text: Universo Kaluanã
  - heading "Rio Tapajós, Tambaqui, Castanheira, Arara." [level=2]
  - paragraph: Há um Duplo King em cada andar. Escolha dormir com o nome de um rio, de um peixe, de uma árvore ou de uma ave.
