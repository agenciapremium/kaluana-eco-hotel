  - heading "Sete categorias. Muitas histórias." [level=2]
  - paragraph: "O Kaluanã Eco Hotel, em Ji-Paraná, oferece sete categorias de acomodação: Superior Família, Duplo King, Superior Acessível, Superior Família com Terraço, Suíte Terraço Lateral Aberto, Suíte Terraço Lateral Fechado e Suíte Presidencial. Todos os quartos levam nomes de rios, peixes, árvores e aves da Amazônia."
  - paragraph: Superior Família, para até três pessoas. Duplo King, para quem quer cama grande e mesa de trabalho. Superior Acessível, com banheiro e circulação adaptados. Superior Família com Terraço, para ficar mais tempo. Suíte Terraço Lateral Aberto e Fechado, com espaço externo privativo. E a Suíte Presidencial Onça-Pintada, no último andar.
