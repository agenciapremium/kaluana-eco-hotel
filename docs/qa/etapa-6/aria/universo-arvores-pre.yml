  - paragraph: "O terceiro andar do Kaluanã leva nomes de árvores da Amazônia. Algumas passam de 50 metros, como a samaúma e a castanheira. Outras dão óleo, fruta, látex, tinta e remédio. Todas crescem em Rondônia. Muitas delas estão no material que você toca neste hotel: no piso, nos móveis, na mesa do restaurante."
