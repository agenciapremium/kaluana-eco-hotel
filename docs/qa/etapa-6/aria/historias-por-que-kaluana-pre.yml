    - text: Nomes
    - heading "Por que Kaluanã" [level=1]
    - paragraph:
      - time: 15 de julho de 2026
      - text: 1 min de leitura
    - img "Superfície de madeira escura com um feixe de luz de janela"
    - paragraph: "Kaluanã é uma palavra de origem indígena e significa grande guerreiro. O nome do hotel foi escolhido antes de qualquer desenho, porque diz o que ele quer ser: firme com a terra, firme com a cidade e firme com quem se hospeda."
    - paragraph: "Escolher o nome antes do projeto inverte a ordem de sempre. Em geral o prédio vem primeiro e o nome vem depois, como rótulo. Aqui foi o contrário: o nome veio primeiro e passou a cobrar do projeto aquilo que ele promete."
    - heading "O que um guerreiro faz" [level=2]
    - paragraph: Um guerreiro não faz barulho. Faz o que precisa ser feito. É assim que o Kaluanã quer ser lembrado, e é por isso que o site mostra processo em vez de prometer natureza.
    - paragraph: "A mesma ideia aparece nas suítes. As três maiores acomodações do hotel levam o nome dos três grandes predadores da floresta: onça-pintada, jaguatirica e jacaré-açu. São os guardiões da casa."
    - heading "O til não é enfeite" [level=2]
    - paragraph: Kaluanã se escreve sempre com til. É a grafia do nome, e é assim que ele aparece na porta, no site e na placa de cada quarto.
    - heading "O que vem a seguir" [level=2]
    - paragraph: As três suítes com nome de guardião estão no Universo Kaluanã, junto com os outros nomes.
    - link "O Kaluanã":
      - /url: /o-kaluana
    - link "Universo Kaluanã":
      - /url: /universo/guardioes
