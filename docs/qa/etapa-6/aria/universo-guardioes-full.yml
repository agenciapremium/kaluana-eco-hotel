      - listitem: Os Guardiões
  - text: Quartos 401 a 403
  - heading "Onça-pintada. Jaguatirica. Jacaré-açu." [level=2]
  - region "Onça-pintada":
    - paragraph: O maior felino das Américas
    - heading "Onça-pintada" [level=3]
    - paragraph: Panthera onca
    - paragraph: A onça-pintada é o maior felino das Américas e o terceiro do mundo. Tem a mordida mais forte entre os grandes felinos em relação ao tamanho, capaz de atravessar o casco de uma tartaruga. Nada, escala, caça jacaré. Para os povos da Amazônia, é o guerreiro da floresta.
    - link "A história":
      - /url: /universo/guardioes/onca-pintada
    - link "Suíte Presidencial Onça-Pintada":
      - /url: /acomodacoes/suite-presidencial-onca-pintada
  - region "Jaguatirica":
    - paragraph: A onça pequena que sobe em tudo
    - heading "Jaguatirica" [level=3]
    - paragraph: Leopardus pardalis
    - paragraph: A jaguatirica é uma onça em miniatura. Pesa entre 8 e 15 quilos, tem a pelagem cheia de rosetas em cadeia e caça à noite. Sobe em árvores, nada e anda quilômetros por noite atrás de roedores, aves e répteis.
    - link "A história":
      - /url: /universo/guardioes/jaguatirica
    - link "Suíte Terraço Lateral Fechado":
      - /url: /acomodacoes/suite-terraco-lateral-fechado
  - region "Jacaré-açu":
    - paragraph: O maior predador das águas amazônicas
    - heading "Jacaré-açu" [level=3]
    - paragraph: Melanosuchus niger
    - paragraph: O jacaré-açu pode passar de 5 metros. É o maior jacaré das Américas e o predador de topo dos rios e lagos da Amazônia. Quase desapareceu pela caça da pele no século XX e voltou. Hoje é visto em toda a bacia.
    - link "A história":
      - /url: /universo/guardioes/jacare-acu
    - link "Suíte Terraço Lateral Aberto":
      - /url: /acomodacoes/suite-terraco-lateral-aberto
  - link "Voltar ao Universo":
    - /url: /universo
  - paragraph: "No quarto andar, três acomodações fogem da regra das aves. São as maiores do hotel e levam o nome dos três grandes predadores da Amazônia: a onça-pintada, a jaguatirica e o jacaré-açu. Kaluanã quer dizer grande guerreiro. Estes são os guardiões da casa."
