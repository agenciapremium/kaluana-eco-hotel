- main:
  - text: Suítes
  - heading "Os Guardiões" [level=1]
  - paragraph: Três guardiões. Três suítes.
  - paragraph: No quarto andar, três acomodações fogem da regra das aves. São as maiores do hotel e levam o nome dos três grandes predadores da Amazônia. Kaluanã quer dizer grande guerreiro. Estes são os guardiões da casa.
